IsDeleteString : delete

# Days a deleted character's name stays reserved before anyone may reuse it.
#
# Reusing a name and restoring a deleted character under its own name are
# mutually exclusive -- once someone else takes it, the original cannot have it
# back. This window is what makes a restore guaranteed rather than best-effort.
# It is measured from DeleteChar.delDate, which CLDeletePCHandler writes on
# every deletion.
#
# 0 (or absent) = reusable immediately.
NameReuseGraceDays : 0
